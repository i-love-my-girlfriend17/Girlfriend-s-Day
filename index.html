<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Noorain</title>
<style>
  :root {
    --plum: #2b1420;
    --plum-deep: #1a0c14;
    --rose: #e8a0b4;
    --rose-soft: #f3c9d4;
    --gold: #d4af6a;
    --cream: #f6ece2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--plum-deep);
    color: var(--cream);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .gate {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, var(--plum) 0%, var(--plum-deep) 70%);
    text-align: center;
    padding: 24px;
  }
  .gate h2 {
    font-weight: 400;
    font-size: 1.6rem;
    color: var(--rose-soft);
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .gate input {
    background: rgba(246,236,226,0.08);
    border: 1px solid var(--gold);
    color: var(--cream);
    font-family: inherit;
    font-size: 1.4rem;
    letter-spacing: 8px;
    text-align: center;
    padding: 12px 20px;
    border-radius: 8px;
    width: 200px;
    outline: none;
  }
  .gate input:focus { box-shadow: 0 0 0 3px rgba(212,175,106,0.3); }
  .gate button {
    margin-top: 20px;
    background: var(--gold);
    color: var(--plum-deep);
    border: none;
    padding: 10px 28px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .gate button:hover { background: var(--rose-soft); }
  .gate-error {
    margin-top: 14px;
    color: var(--rose);
    font-size: 0.9rem;
    font-style: italic;
    min-height: 20px;
  }

  .envelope-stage {
    height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at 50% 30%, var(--plum) 0%, var(--plum-deep) 70%);
  }

  .envelope {
    position: relative;
    width: 280px;
    height: 190px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .envelope:hover { transform: translateY(-4px); }

  .env-body {
    position: absolute;
    inset: 0;
    background: var(--rose-soft);
    border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100px;
    background: var(--rose);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform 0.6s cubic-bezier(.6,-0.3,.4,1.3);
    z-index: 3;
  }

  .env-seal {
    position: absolute;
    top: 68px; left: 50%;
    transform: translateX(-50%);
    width: 34px; height: 34px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--plum-deep);
    z-index: 4;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }

  .env-letter {
    position: absolute;
    left: 10%; right: 10%;
    top: 12px;
    height: 160px;
    background: var(--cream);
    border-radius: 3px;
    z-index: 2;
    transform: translateY(0);
    transition: transform 0.7s cubic-bezier(.2,.8,.3,1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .envelope.open .env-flap { transform: rotateX(180deg); }
  .envelope.open .env-letter { transform: translateY(-220px); }

  .hint {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rose-soft);
    opacity: 0.7;
  }

  .letter-content {
    display: none;
    max-width: 680px;
    margin: 0 auto;
    padding: 80px 32px 120px;
    text-align: center;
  }
  .letter-content.show { display: block; animation: fadeUp 1s ease both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 400;
    color: var(--rose-soft);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1.1rem;
    color: var(--gold);
    font-style: italic;
    margin-bottom: 40px;
  }

  .reasons-label {
    font-size: 0.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
  }

  .reasons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
    margin-bottom: 48px;
  }

  .reason {
    background: rgba(232,160,180,0.08);
    border-left: 3px solid var(--gold);
    padding: 14px 20px;
    border-radius: 0 8px 8px 0;
    font-size: 1rem;
    line-height: 1.5;
  }
  .reason .num {
    display: inline-block;
    min-width: 28px;
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: bold;
    margin-right: 6px;
  }

  .signoff {
    font-size: 1.3rem;
    font-style: italic;
    color: var(--rose-soft);
  }

  .footer-note {
    margin-top: 40px;
    font-size: 0.85rem;
    opacity: 0.5;
  }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <h2>this one's just for you, jaanu</h2>
    <input type="password" id="pwInput" maxlength="4" inputmode="numeric" placeholder="••••" autofocus>
    <button onclick="checkPassword()">Unlock</button>
    <div class="gate-error" id="gateError"></div>
  </div>

  <div class="envelope-stage" id="stage">
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-letter"></div>
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal">♥</div>
    </div>
    <div class="hint">tap the envelope, mommy</div>
  </div>

  <div class="letter-content" id="letterContent">
    <h1>Happy Girlfriend's Day, Noorain</h1>
    <div class="subtitle">to my mommy, my jaanu, my favorite person</div>

    <div class="reasons-label">100 reasons I love you</div>
    <div class="reasons" id="reasonsList"></div>

    <div class="signoff">That's only 100. There's no real limit. I love you, jaanu. 🤍</div>
    <div class="footer-note">made with you in mind — Aug 1, Girlfriend's Day</div>
  </div>

<script>
  const CORRECT_PASSWORD = "2706";
  const pwInput = document.getElementById('pwInput');
  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  function checkPassword() {
    const val = pwInput.value.trim();
    if (val === CORRECT_PASSWORD) {
      document.getElementById('gate').style.transition = 'opacity 0.5s ease';
      document.getElementById('gate').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('stage').style.display = 'flex';
      }, 500);
    } else {
      document.getElementById('gateError').textContent = 'not quite — try again';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  function openEnvelope() {
    const env = document.getElementById('envelope');
    const stage = document.getElementById('stage');
    const content = document.getElementById('letterContent');
    env.classList.add('open');
    setTimeout(() => {
      stage.style.transition = 'opacity 0.6s ease';
      stage.style.opacity = '0';
      setTimeout(() => {
        stage.style.display = 'none';
        content.classList.add('show');
      }, 600);
    }, 900);
  }

  const reasons = [
    "The way you say 'jaanu' makes an ordinary word sound like home.",
    "You remember the small things I mention once and never repeat.",
    "You make me laugh at the worst possible moments, in the best way.",
    "Your good morning texts set the tone for my whole day.",
    "You're honest with me even when it's easier not to be.",
    "You call me out on my nonsense, gently but firmly.",
    "The way you get excited over tiny wins like they're huge news.",
    "You never make me feel silly for caring about something.",
    "You're the calm in my chaos.",
    "You give the best hugs, hands down.",
    "You're patient with me on my bad days.",
    "You make plans exciting just by being part of them.",
    "Your voice is the first thing I want to hear when something good happens.",
    "You never let an argument turn into something ugly.",
    "You say what you mean, and mean what you say.",
    "You're 'mommy' in the way you take care of everyone around you.",
    "You worry about me in a way that feels like love, not control.",
    "You've never once made me feel unimportant.",
    "You remember dates and details I forget about myself.",
    "You make even boring errands feel like an adventure.",
    "The way you get sleepy and stubborn at the same time is adorable.",
    "You fight for us instead of walking away.",
    "You're my favorite person to text first thing.",
    "You make me want to be a better version of myself.",
    "You never hold grudges for long.",
    "You say 'jaanu' and I forget whatever I was upset about.",
    "You listen without immediately trying to fix everything.",
    "You know exactly when I need space and when I need you close.",
    "Your sense of humor matches mine in the weirdest way.",
    "You're proud of me even for small things.",
    "You've never made me feel like too much.",
    "You show up, even when it's inconvenient.",
    "You're gentle with people who are having a hard time.",
    "You make effort without being asked.",
    "You're just as excited for my wins as I am.",
    "You're honest about my bad ideas, and I need that.",
    "You've never used my trust against me.",
    "You make the ordinary days memorable somehow.",
    "You're stubborn in a way that's oddly endearing.",
    "You never let me spiral alone.",
    "You take care of me like it's second nature.",
    "You make jokes at exactly the right moment to defuse tension.",
    "You're mommy energy in the best possible way — steady, warm, in charge.",
    "You forgive quickly but you don't forget the lesson.",
    "You've got a memory like a steel trap for things that matter to me.",
    "You make me feel chosen, every single day.",
    "You're not afraid to tell me when I'm being difficult.",
    "You still get shy sometimes, and it's the cutest thing.",
    "You've never once made our relationship feel like a competition.",
    "You know how to make me feel better with just a few words.",
    "You take my side, even when you also think I'm wrong.",
    "You're loyal in a way that isn't loud about it, just constant.",
    "You make future plans with me like they're already decided.",
    "You're the reason some songs mean something now.",
    "You've never made me feel small for feeling too much.",
    "You get genuinely curious about the things I care about.",
    "You're soft with me even when you're having a rough day.",
    "You call things out fairly, not just to win an argument.",
    "You never let a fight end without actually resolving it.",
    "You're the first person I want to tell good news to.",
    "You make me feel safe enough to be completely myself.",
    "You never make my feelings feel like an inconvenience.",
    "You're 'jaanu' because you really are my life in a word.",
    "You show love through actions, not just words.",
    "You never let me apologize for things that aren't my fault.",
    "You're endlessly better at reading me than I expect.",
    "You make quiet nights in feel like the best plan possible.",
    "You've got a way of making me feel understood without explaining much.",
    "You never make me choose between you and my other priorities.",
    "You're generous with your time when it comes to me.",
    "You keep your promises, even the small ones.",
    "You make me want to plan a whole future, not just the next date.",
    "You're the person I compare every good thing to.",
    "You never let insecurity turn into cruelty.",
    "You've got a way of grounding me when my head is everywhere.",
    "You take my dreams seriously, even the unrealistic ones.",
    "You're never afraid to admit when you're wrong.",
    "You make me feel like the effort is always mutual.",
    "You've got the kind of warmth that makes people feel welcome.",
    "You never treat my bad mood like it's your job to escape.",
    "You stay when things get hard instead of checking out.",
    "You're endlessly better company than being alone.",
    "You make me want to be around for a long, long time.",
    "You've never made love feel conditional.",
    "You give advice honestly, even when it's not what I want to hear.",
    "You've got a memory for inside jokes that keeps them alive for years.",
    "You never let me feel like a burden.",
    "You make effort to understand things I care about, even if they're not your thing.",
    "You're patient in a world that mostly isn't.",
    "You've never once made me question your loyalty.",
    "You make me feel like home is a person, not a place.",
    "You're the reason 'mommy' and 'jaanu' aren't just nicknames anymore, they're just you.",
    "You never let distance change how you show up.",
    "You make the mundane days feel worth showing up for.",
    "You've got a way of making apologies feel real, not performative.",
    "You never make me feel like I have to earn your love.",
    "You make me laugh even when I'm trying to stay mad at you.",
    "You've never once made me feel unchosen.",
    "You're just, plainly, my favorite person on this earth.",
    "You make forever sound like a reasonable plan, not a scary one."
  ];

  const list = document.getElementById('reasonsList');
  reasons.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'reason';
    div.innerHTML = '<span class="num">' + (i + 1) + '.</span>' + text;
    list.appendChild(div);
  });
</script>

</body>
</html>
